{% load static %}
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buyırtpa beriw | QTech</title>
<link rel="stylesheet" href="{% static 'orders/css/checkout.css' %}">
</head>
<body>
<nav class="navbar">
    <div class="header">
        <a href="{% url 'main:home' %}" class="logo">QTech</a>
        <ul class="nav-links">
            <li><a href="{% url 'main:home' %}">Birinshi bet</a></li>
            <li><a href="{% url 'products:list_products' %}">O'nimler</a></li>
            <li><a href="{% url 'cart:cart_detail' %}">Sebet</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <h1>Buyırtpa beriw</h1>
    <p>Sebettegi o'nimlerdi tekserip, to‘lewdi a'melge asırın'.</p>

    <form action="{% url 'payments:payment_success' %}" method="post">
        {% csrf_token %}
        <label for="fullname">Toliq atin'iz:</label>
        <input type="text" id="fullname" name="fullname" required>

        <label for="address">Ma'nzilin'iz:</label>
        <input type="laction" id="address" name="address" required>

        <label for="phone">Telefon nomerin'iz:</label>
        <input type="tel" id="phone" name="phone" required>

        <button type="submit" class="checkout-btn">To‘lewge o‘tıw</button>
    </form>
</div>

<footer class="footer">
    <div class="ftr">
        <p>© 2025 QTech. Ba'rche huqıqlar qorg'alg'an.</p>
    </div>
</footer>
</body>
</html>
